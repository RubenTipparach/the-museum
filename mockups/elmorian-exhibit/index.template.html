<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Elmorian Exhibit</title>
<style>
  /* The museum's own palette (docs/ARCHITECTURE.html): case green, label paper, case light. */
  :root { --wall: #1b211e; --paper: #d8d3c5; --paper-soft: #929c95; --spot: #d9a75a; --ink: #0d110f; --rule: #334039; }
  html, body { margin: 0; height: 100%; background: var(--wall); color: var(--paper); overflow: hidden; -webkit-user-select: none; user-select: none; font-family: Georgia, "Times New Roman", serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .eyebrow { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--spot); }
  #top { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); pointer-events: none; }
  #roomName { display: block; font-size: 22px; line-height: 1.1; color: var(--paper); margin-top: 3px; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #reset, #archInfo, #back, #cardClose { font: inherit; }
  #reset { position: absolute; right: max(12px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); background: none; border: 1px solid var(--rule); color: var(--paper-soft); border-radius: 3px; padding: 6px 10px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .08em; }
  #archInfo { position: absolute; right: max(12px, env(safe-area-inset-right)); top: calc(max(12px, env(safe-area-inset-top)) + 36px); background: none; border: 1px solid var(--rule); color: var(--paper-soft); border-radius: 3px; padding: 6px 10px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .08em; }
  #card { position: absolute; left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 62px);
          height: 38vh; max-height: 340px; background: rgba(216,211,197,.96); color: var(--ink); border-radius: 4px; box-shadow: 0 8px 30px rgba(0,0,0,.5); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  #card[hidden] { display: none; }
  #cardHead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 14px 6px; border-bottom: 1px solid rgba(0,0,0,.15); }
  #cardTitle { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.2; }
  #cardClose { background: none; border: 0; color: #5a5040; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 4px 0; }
  #cardText { overflow-y: auto; padding: 8px 14px 14px; font-size: 14.5px; line-height: 1.5; }
  #cardText p { margin: 0 0 10px; }
  #back { position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 10px); background: rgba(27,33,30,.85); border: 1px solid var(--spot); color: var(--paper); border-radius: 3px; padding: 10px 16px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  #back[hidden] { display: none; }
  #chips { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 6px; }
  #chips button { width: 44px; height: 44px; padding: 6px; background: rgba(27,33,30,.85); border: 1px solid var(--rule); border-radius: 3px; }
  #chips button img { width: 100%; height: 100%; display: block; opacity: .9; }
  #chips button.here { border-color: var(--spot); }
  #chips button.locked img { opacity: .22; }
  #hint { position: absolute; left: 0; right: 0; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 64px); text-align: center; color: var(--paper-soft); font-size: 13px; letter-spacing: .04em; transition: opacity .8s; pointer-events: none; }
  #hint.gone { opacity: 0; }
  #toast { position: absolute; left: 0; right: 0; top: 30%; text-align: center; color: var(--spot); font-size: 18px; letter-spacing: .06em; opacity: 0; transition: opacity .5s; pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  #toast.on { opacity: 1; }
  button:focus-visible { outline: 2px solid var(--spot); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div id="top"><span class="eyebrow" id="roomSub">Hall Six</span><span id="roomName">The Forecourt</span></div>
  <button id="reset">restart</button>
  <button id="archInfo">about</button>
  <div id="card" hidden>
    <div id="cardHead"><h2 id="cardTitle"></h2><button id="cardClose">close</button></div>
    <div id="cardText"></div>
  </div>
  <button id="back" hidden>Back</button>
  <nav id="chips" aria-label="Rooms"></nav>
  <div id="hint">Drag to look. Tap to touch.</div>
  <div id="toast"></div>
</div>
<!-- three.js r158, MIT, vendored: see vendor/LICENSE -->
<script>{{THREE}}</script>
<script>{{PUZZLES}}</script>
<script>{{ART}}</script>
<script>{{LORE}}</script>
<script>{{GAME}}</script>
</body>
</html>
