; Godot export presets. Hand written; Godot 4.7.1 accepts the shape (it is the
; one the-federation ships with). The preset name matches the "godot preset"
; column of build.config exactly: scripts/build.sh passes it to
; --export-release.
;
; thread_support=false, because a threaded web build needs COOP and COEP
; headers that itch.io does not send. vram_texture_compression is off both
; ways: every texture imports as Basis Universal (project.godot
; importer_defaults), which transcodes to what the phone or the desktop GPU
; actually supports, so one download serves both.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../builds/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=false
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
