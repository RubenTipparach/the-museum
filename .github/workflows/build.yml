name: build

# ONE workflow, because one commit should start ONE run. There were two files
# here with identical triggers, checks.yml and this, so every push and every
# pull request produced two runs and a merge to main produced two more. Two
# jobs in one workflow is the same work with one entry in the Actions list.
#
# What runs: the renderer proof (docs/ARCHITECTURE.md ADR-0), and the GDScript
# web build (ADR-14) with the puzzle tests, every room rendered under xvfb, the
# audio gate, the Web export, that export booted in headless Chromium and
# played to its end, and, on main, the upload to itch.io.
#
# The writing style check is deliberately NOT here. Em and en dashes are a rule
# about how this repository is written, which belongs to whoever is writing:
# ./scripts/check-style.sh is run before pushing, not discovered from a red
# build. CLAUDE.md 1.
#
# Every step delegates to a script in scripts/ so CI and a developer's machine
# run the identical build (CLAUDE.md 4.1); nothing is built in YAML. Triggers
# are disjoint so one commit never starts two runs: pull_request covers every
# branch, push covers main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, but do not upload to itch.io"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  render:
    name: The engine renders
    # Requirement 0 (docs/ARCHITECTURE.md ADR-0) is proven in the Claude Code
    # sandbox by rule, and this job is the same proof on a runner: it installs
    # a software Vulkan driver, downloads the pinned editor, compiles the C#
    # and draws a Forward+ frame with twelve shadow casting lights. About one
    # minute, and it fails on a black frame.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo ./scripts/install-sandbox-deps.sh
      - run: ./scripts/render-proof.sh
      - uses: actions/upload-artifact@v4
        with:
          name: forward-plus-frame
          path: docs/reference/forward_plus_lavapipe_proof.png

  build:
    name: Test, export, verify, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAN_DEPLOY: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read build config
        id: config
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source build.config
          echo "godot_version=$GODOT_VERSION.$GODOT_RELEASE" >> "$GITHUB_OUTPUT"
          echo "flavor=$ITCH_GODOT_FLAVOR" >> "$GITHUB_OUTPUT"

      - name: Shell syntax and the config against the presets
        run: |
          set -euo pipefail
          for f in scripts/*.sh scripts/lib/*.sh; do bash -n "$f"; done
          ./scripts/check-config.sh

      # The prototype is the design reference and its rules must not drift from
      # the game's. Nothing ran these until a "type": "module" in the root
      # package.json turned puzzles.js into ESM and broke them unnoticed.
      - name: The prototype's own checks
        run: node mockups/elmorian-exhibit/test.mjs

      - name: Cache Godot and the web export templates
        uses: actions/cache@v4
        with:
          path: |
            .tools/godot-standard
            ~/.local/share/godot/export_templates
          key: godot-${{ steps.config.outputs.godot_version }}-${{ steps.config.outputs.flavor }}-web

      - name: Install Godot (standard) and the web templates
        run: ./scripts/install-godot.sh standard

      # The scene test renders under xvfb on Mesa's software GL; installed
      # explicitly because run-tests.sh skips that test when xvfb is missing,
      # and a test that quietly skips is worse than one that fails.
      - name: Install xvfb and Mesa
        run: sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri

      # The audio gate renders every sound from its source, csound for the
      # effects and fluidsynth for the score, and measures what comes out. It
      # exists because a release shipped as static and every other suite was
      # green throughout (docs/AUDIO.md section 7).
      - name: Install the audio tools
        run: ./scripts/install-audio-tools.sh

      - name: Every sound matches its source, and is not static
        run: ./scripts/render-audio.sh --check

      - name: Puzzle tests and every room rendered
        run: ./scripts/run-tests.sh

      - name: Export the web build
        run: ./scripts/build.sh

      # The harnesses import playwright; package.json declares it and the
      # lockfile pins it, so the browser installed here matches the package.
      - name: Install the browser harnesses and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Boot the web build in headless Chromium
        run: ./scripts/verify-build.sh

      - name: Play the web build to its end
        run: node itch/tests/playthrough.mjs builds/web

      - name: Upload the build and the frames
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-build-and-frames
          path: |
            builds/web
            docs/reference/itch_*.png
          retention-days: 14
          if-no-files-found: error

      - name: Install butler
        if: env.CAN_DEPLOY == 'true'
        run: ./scripts/install-butler.sh

      - name: Check for itch.io credentials
        id: creds
        if: env.CAN_DEPLOY == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BUTLER_API_KEY is not set, skipping the itch.io upload."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Gated on main, so a pull request can never publish.
      - name: Deploy to itch.io
        if: env.CAN_DEPLOY == 'true' && steps.creds.outputs.present == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: ./scripts/deploy-itch.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### itch track"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`$(git describe --tags --dirty 2>/dev/null || echo "r$(git rev-list --count HEAD)-$(git rev-parse --short HEAD)")\` |"
            echo "| Deployed | ${{ env.CAN_DEPLOY == 'true' && 'yes, if credentials present' || 'no, not main' }} |"
            echo "| Page | https://ruben-tipparach.itch.io/the-museum |"
          } >> "$GITHUB_STEP_SUMMARY"
