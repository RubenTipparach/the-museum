name: build

# The CI builds, tests and deploys. That is the whole of its job.
#
# What is NOT here, and why: three checks that look like CI and are not. The
# renderer proof draws a frame to prove the engine runs headless, the audio
# render re-renders every sound from csound and fluidsynth to prove it has not
# drifted, and the playtest drives the exported build through a browser. All
# three are harness checks, run before making a claim about a frame, a sound or
# a playthrough, and none of them is a reason for a commit to be red. They live
# in .github/workflows/harness.yml, which only runs when someone asks it to.
# The writing style check (em and en dashes, CLAUDE.md 1) is out for the same
# reason: it belongs to whoever is writing, not to the build.
#
# Every step delegates to a script in scripts/ so CI and a developer's machine
# run the identical build (CLAUDE.md 4.1); nothing is built in YAML. Triggers
# are disjoint so one commit never starts two runs: pull_request covers every
# branch, push covers main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, but do not upload to itch.io"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Test, export, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAN_DEPLOY: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read build config
        id: config
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source build.config
          echo "godot_version=$GODOT_VERSION.$GODOT_RELEASE" >> "$GITHUB_OUTPUT"
          echo "flavor=$ITCH_GODOT_FLAVOR" >> "$GITHUB_OUTPUT"

      - name: Shell syntax and the config against the presets
        run: |
          set -euo pipefail
          for f in scripts/*.sh scripts/lib/*.sh; do bash -n "$f"; done
          ./scripts/check-config.sh

      # The prototype is the design reference and its rules must not drift from
      # the game's. Nothing ran these until a "type": "module" in the root
      # package.json turned puzzles.js into ESM and broke them unnoticed.
      - name: The prototype's own checks
        run: node mockups/elmorian-exhibit/test.mjs

      - name: Cache Godot and the web export templates
        uses: actions/cache@v4
        with:
          path: |
            .tools/godot-standard
            ~/.local/share/godot/export_templates
          key: godot-${{ steps.config.outputs.godot_version }}-${{ steps.config.outputs.flavor }}-web

      - name: Install Godot (standard) and the web templates
        run: ./scripts/install-godot.sh standard

      # The scene test is a test: 23 assertions about what the real scene puts
      # on screen, that a tap offers a label rather than opening it, that Read
      # sits under the item, that Close is at the foot of the card. It needs a
      # rendering context to ask any of that, hence xvfb, and it is installed
      # explicitly because run-tests.sh skips the test when xvfb is missing and
      # a test that quietly skips is worse than one that fails.
      - name: Install xvfb and Mesa
        run: sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri

      - name: Puzzle tests and the scene assertions
        run: ./scripts/run-tests.sh

      - name: Export the web build
        run: ./scripts/build.sh

      - name: Upload the build and the frames
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-build-and-frames
          path: |
            builds/web
            docs/reference/itch_*.png
          retention-days: 14
          if-no-files-found: error

      - name: Install butler
        if: env.CAN_DEPLOY == 'true'
        run: ./scripts/install-butler.sh

      - name: Check for itch.io credentials
        id: creds
        if: env.CAN_DEPLOY == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::BUTLER_API_KEY is not set, skipping the itch.io upload."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Gated on main, so a pull request can never publish.
      - name: Deploy to itch.io
        if: env.CAN_DEPLOY == 'true' && steps.creds.outputs.present == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: ./scripts/deploy-itch.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "### itch track"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`$(git describe --tags --dirty 2>/dev/null || echo "r$(git rev-list --count HEAD)-$(git rev-parse --short HEAD)")\` |"
            echo "| Deployed | ${{ env.CAN_DEPLOY == 'true' && 'yes, if credentials present' || 'no, not main' }} |"
            echo "| Page | https://ruben-tipparach.itch.io/the-museum |"
          } >> "$GITHUB_STEP_SUMMARY"
